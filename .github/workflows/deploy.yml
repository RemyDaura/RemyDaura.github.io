name: Vérifier et publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule la vérification en cours sur la même branche
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux par défaut ; seul le job de publication reçoit ceux de GitHub Pages.
permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Construire le site
        run: npm run build

      - name: Valider le HTML
        run: npm run verifier:html

      - name: Vérifier les liens internes
        run: npm run verifier:liens

      # Installés seulement ici, pour ne pas alourdir l'installation locale
      - name: Installer le navigateur de test
        run: |
          npm install --no-save playwright@1.64.1 axe-core@4.14.0
          npx playwright install --with-deps chromium

      - name: Vérifier l'accessibilité
        run: npm run verifier:a11y

      - name: Préparer la publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publication sur https://remydaura.github.io, seulement depuis main
  publier:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5